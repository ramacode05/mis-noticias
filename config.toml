# =====================================================================
#  CONFIGURACIÓN DE "MIS NOTICIAS"
#  Podés editar este archivo directamente desde la web de GitHub
#  (botón del lápiz ✏️). Las líneas que empiezan con # son comentarios.
# =====================================================================

[general]
# Modelo de Claude. Haiku 4.5 es el más económico.
modelo = "claude-haiku-4-5"

# Tope de gasto diario en la API de Claude (en dólares). Si se alcanza,
# el robot deja de redactar noticias nuevas hasta el día siguiente (UTC).
presupuesto_diario_usd = 1.50

# Relevancia mínima (1 a 5) para que una noticia se publique.
# 3 = filtra lo menor. Subilo a 4 si querés solo lo más importante
# (y gastar menos); bajalo a 2 si querés ver más cosas.
relevancia_minima = 3

# Cuántas horas de noticias se muestran en la web.
horas_a_mostrar = 72

# Noticias más viejas que esto (en horas) se ignoran al leer los RSS.
antiguedad_maxima_horas = 24

# En la primera ejecución (sin historial) solo se procesan las noticias
# de las últimas N horas, para no gastar de más.
horas_primera_vez = 4

# Máximo de noticias nuevas a redactar por ejecución (cada 15 min).
# Lo que no entra queda para la siguiente.
max_historias_por_ejecucion = 30

# Descargar el texto de la nota original para que la explicación sea
# más completa (mejor calidad, un poco más de costo).
leer_nota_completa = true

# ---------------------------------------------------------------------
#  FUENTES
#  Cada [[fuente]] tiene:
#   medio    -> nombre que se muestra en la web
#   urls     -> lista de RSS; se prueban EN ORDEN y se usa el primero
#               que funcione (los siguientes son alternativas).
#   dominio  -> si TODOS los RSS fallan, se usa como último recurso
#               Google News filtrado por ese dominio.
#   muro     -> true si el medio tiene muro de pago (paywall)
#   idioma   -> "en" o "es"
# ---------------------------------------------------------------------

# ===================== INTERNACIONALES =====================

# Reuters cerró sus RSS públicos en 2020. Alternativa equivalente:
# Google News filtrado por reuters.com (los links abren la nota de Reuters).
[[fuente]]
medio = "Reuters"
urls = [
  "https://news.google.com/rss/search?q=site:reuters.com/markets+OR+site:reuters.com/business+when:1d&hl=en-US&gl=US&ceid=US:en",
  "https://news.google.com/rss/search?q=site:reuters.com+when:1d&hl=en-US&gl=US&ceid=US:en",
]
dominio = "reuters.com"
muro = false
idioma = "en"

