name: Actualizar noticias

on:
  schedule:
    # Cada 15 minutos (GitHub puede demorarlo algunos minutos en horas pico).
    - cron: "*/15 * * * *"
  # Permite ejecutarlo a mano desde la pestaña Actions.
  workflow_dispatch:

permissions:
  contents: write

# Evita que dos ejecuciones se pisen.
concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Leer RSS y redactar con Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/actualizar.py

      - name: Guardar resultados
        run: |
          git config user.name "robot-noticias"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "Noticias actualizadas $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
