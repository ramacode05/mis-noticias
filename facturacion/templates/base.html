<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Facturación{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <header>
    <strong>Facturación</strong>
    <nav>
      <a href="{{ url_for('clientes.lista') }}">Clientes</a>
      <a href="{{ url_for('conceptos.lista') }}">Conceptos</a>
      <span class="pronto" title="Próximas etapas">Facturas · Cobros · Cuentas corrientes</span>
    </nav>
  </header>
  <main>
    {% for categoria, mensaje in get_flashed_messages(with_categories=true) %}
      <div class="aviso {{ categoria }}">{{ mensaje }}</div>
    {% endfor %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
